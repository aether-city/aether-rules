# ページを公開する (JavaScript を難読化してから GitHub Pages に載せる)
#
# 使う前に一度だけ: リポジトリの Settings → Pages → Build and deployment の Source を
# 「GitHub Actions」に切り替える。
# 切り替えると、公開されるのは build.js が作る _site/ だけになる (src/ や .github/ は公開されない)。

name: ページを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 準備
        run: npm ci

      - name: 難読化して _site を作る
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
